version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Europe/Athens
    open-pull-requests-limit: 3
    versioning-strategy: increase
    rebase-strategy: auto
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      all-non-major:
        patterns: ['*']
        update-types: [patch, minor]
    ignore:
      - dependency-name: vite
        update-types: [version-update:semver-major]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Europe/Athens
    open-pull-requests-limit: 2
    rebase-strategy: auto
    cooldown:
      default-days: 3
      semver-minor-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ['*']
    labels:
      - dependencies
