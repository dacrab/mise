name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'dependabot-queue' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: dacrab/.github-workflows/.github/workflows/bun-ci.yml@v1
    with:
      check-cmd: 'bun run typecheck && bun run lint'
      test-cmd: 'bun run test:run'
      build-cmd: 'bun run build'
      build-env: '{"VITE_CONVEX_URL":"${{ secrets.VITE_CONVEX_URL }}"}'

  auto-merge:
    needs: ci
    permissions:
      pull-requests: write
      contents: write
    uses: dacrab/.github-workflows/.github/workflows/dependabot-auto-merge.yml@v1
    with:
      target: minor
      exclude: 'vite,knip'
